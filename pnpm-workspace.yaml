minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  # Manual re-release of 1.1.3 after an accidental breaking release of 1.1.4.
  # https://github.com/aklinker1/webext-core/issues/154
  - "@webext-core/isolated-element@1.1.5"
  # v6 maintenance release published after v7 adopted provenance.
  # https://github.com/npm/node-semver/releases/tag/v6.3.1
  - semver@6.3.1

registry: https://npm.flatt.tech/
shellEmulator: true

# Tab messages must read chrome.runtime.lastError; v4 reads it only for runtime messages.
patchedDependencies:
  "@webext-core/messaging@4.0.0": patches/@webext-core__messaging@4.0.0.patch
# Keep dependency scripts disabled; native tools use their platform packages.
allowBuilds:
  esbuild: false
  msw: false
  nx: false
  spawn-sync: false
